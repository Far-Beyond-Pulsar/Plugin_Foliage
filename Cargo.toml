[package]
name = "foliage_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Foliage (`pulsar.foliage`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The editor's registrations (the Foliage tool mode, its palette in the level
# file, the level wind's Create entry and World Settings section) and the
# crates they need. A game links the root without it, so it takes no editor
# dependency.
editor = ["dep:foliage_editor", "dep:ui_level_editor"]

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
# The plugin's crates.
foliage_component = { workspace = true }
foliage_editor = { workspace = true, optional = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
pulsar_world_registry = { workspace = true }
pulsar_settings = { workspace = true }
helio-pass-foliage-place = { workspace = true }
# The editor's extension points.
ui_level_editor = { workspace = true, optional = true }

[dev-dependencies]
pulsar_scenedb = { workspace = true }
# The row join suite (`tests/scene_rows.rs`): the engine's join harness.
helio = { workspace = true }
helio-core = { workspace = true }
helio-scene-join = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
pollster = "=0.4.0"
glam = { workspace = true }

[lints]
workspace = true
