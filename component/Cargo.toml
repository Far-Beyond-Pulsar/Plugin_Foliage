[package]
name = "foliage_component"
version = "0.1.0"
edition = "2024"
description = "Foliage (pulsar.foliage): the foliage and wind components, their rows, row join, level rule and the plugin's Helio feature set (placement and the G-buffer drawer); the plugin's root crate registers them"

[lib]
name = "foliage_component"

[features]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[dependencies]
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_scene_model = { workspace = true }
helio_component = { workspace = true }
# The level rules' ordering and the project's resolved settings. The game's
# slim feature set (as pulsar_game): linking the plugin must not pull the
# editor's features into a game build. A path dependency because the
# workspace table cannot opt out of default features.
engine_backend = { path = "../../../../crates/core/engine_backend", default-features = false, features = ["render"] }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio = { workspace = true }
helio-feature-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-foliage-api = { workspace = true }
helio-pass-foliage-place = { workspace = true }
helio-pass-foliage-gbuffer = { workspace = true }
glam = { workspace = true }

[lints]
workspace = true
