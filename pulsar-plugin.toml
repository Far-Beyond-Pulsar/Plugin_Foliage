# The `pulsar.foliage` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.foliage"
name = "Foliage"
description = "Foliage and the level's wind: their components, rows, settings and the renderer feature that places and draws them"
enabled_by_default = true
provides = [
    { id = "pulsar.foliage.rows", kind = "buffer", members = ["foliage_types", "foliage_layers", "foliage_interactors", "foliage_wind"], version = 1 },
    { id = "pulsar.foliage.api", kind = "api", members = ["helio-foliage-api"], version = 1 },
]
requires = []

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "foliage_plugin"
