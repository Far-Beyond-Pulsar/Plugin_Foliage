# The foliage plugin's rows of the SceneDB closure ledger (Pulsar-Native#1035):
# its classes, GPU schemas, buffers, pass crates and call sites. A plugin owns
# the rows of what it ships (Pulsar-Native#1606); `cargo test -p scene_inventory`
# in a Pulsar-Native checkout recomputes every fact column, checks the human
# columns, and fails on a missing, stale or misplaced row. The columns are
# described in Pulsar-Native's crates/core/scene_inventory/ledger.toml.

# ── Exposed component classes ───────────────────────────────────

[[class]]
name = "WindComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "foliage_component::wind"
disposition = "render (#1123). The level's global wind, one per level (a level singleton the foliage plugin registers with engine_backend::scene::level_rules), edited in World Settings. Its derived GlobalWindSourceRow is written on every insert, write, removal and replay; the environment join places it as the foliage passes' wind row over the foliage components' own wind (visibility does not apply). Its motion is the renderer's frame clock"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (foliage_sways_in_the_global_wind_on_the_frame_clock); plugins/vendor/foliage/tests/scene_rows.rs (foliage_sways_in_the_global_wind_unless_it_opts_out)"
status = "verified"

[[class]]
name = "FoliageComponent"
category = "Rendering"
world_registered = true
own_gpu_columns = true
owner = "foliage_component::foliage"
disposition = "render, Phase 4. Its derived source row is written on every insert, write, removal and replay; the environment join gates and packs its type, layer and wind into the foliage passes' tables. Blades sway in the level's global wind (WindComponent) by their per-band response, on the renderer's frame clock (#1123, #1109); a component may opt out for its own wind (use_global_wind), and a level without a global wind uses the components' own. Grass grows on flat ground at Y 0, no terrain capture in the editor (#1064). Limits, each tracked: types share layers and one wind applies to all foliage (#1123), and the interactor and material colour fields have no consumer (#1063)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/foliage/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (foliage_reaches_the_frame, foliage_sways_in_the_global_wind_on_the_frame_clock)"
status = "verified"

# ── GPU-bearing schemas ─────────────────────────────────────────

[[schema]]
type = "FoliageComponentGpuMirror"
path = "foliage_component::foliage::component::FoliageComponentGpuMirror"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "none: the generated companion uploads a GPU row only for an #[engine_class(gpu_rows)] class (Phase 4); no engine class opts in"
owner = "foliage_component::foliage::component"
disposition = "keep as a CPU mapping type (LightComponent's derived LightSourceRow is built from its mirror); nothing is uploaded"
target_contract = "Phase 1; 03-gpu-reflection-and-rendering.md"
test = "crates/core/engine_class_derive/tests/gpu_mirror_derive.rs (without_gpu_rows_the_companion_uploads_nothing)"
status = "verified"

[[schema]]
type = "WindComponent"
path = "foliage_component::wind::WindComponent"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "the authored value's SceneDB GPU dispatch is its derived GlobalWindSourceRow (environment_rows), on every insert, write, removal and replay; the generated companion uploads nothing"
owner = "foliage_component::wind"
disposition = "keep: the authored type's GPU row is GlobalWindSourceRow, the environment join's input"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (foliage_sways_in_the_global_wind_on_the_frame_clock); plugins/vendor/foliage/tests/scene_rows.rs (foliage_sways_in_the_global_wind_unless_it_opts_out)"
status = "verified"

[[schema]]
type = "GlobalWindSourceRow"
path = "foliage_component::GlobalWindSourceRow"
buffers = ["wind_sources"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "WindComponent's derived GPU registration (the foliage wind row marked global; zero while disabled), on every insert, write, removal and replay"
owner = "foliage_component"
disposition = "keep: the environment join's global wind input"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (foliage_sways_in_the_global_wind_on_the_frame_clock); plugins/vendor/foliage/tests/scene_rows.rs (foliage_sways_in_the_global_wind_unless_it_opts_out)"
status = "verified"

[[schema]]
type = "FoliageComponent"
path = "foliage_component::foliage::component::FoliageComponent"
buffers = []
clears_on_remove = true
releases_var_len = false
registered = false
writer = "the authored value's SceneDB GPU dispatch is its derived FoliageSourceRow (environment_rows), on every insert, write, removal and replay; the generated companion uploads nothing (Phase 4)"
owner = "foliage_component::foliage::component"
disposition = "keep: the authored type's GPU row is FoliageSourceRow, the environment join's input"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/foliage/tests/scene_rows.rs"
status = "verified"

[[schema]]
type = "FoliageSourceRow"
path = "foliage_component::FoliageSourceRow"
buffers = ["foliage_sources"]
clears_on_remove = true
releases_var_len = false
registered = true
writer = "FoliageComponent's derived GPU registration (type row, layer, wind row; zero when disabled), on every insert, write, removal and replay"
owner = "foliage_component"
disposition = "keep: the environment join's foliage input (Phase 4)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/foliage/tests/scene_rows.rs"
status = "verified"

# ── GPU buffer keys ─────────────────────────────────────────────

[[buffer]]
key = "wind_sources"
producers = ["GlobalWindSourceRow"]
consumers = []
owner = "helio_component::components::environment_rows"
disposition = "keep: the level's WindComponent, derived on every write; the environment join reads it into foliage_wind and over the wind of every water_volumes row that does not opt out (#1065)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/installed/tests/render_acceptance.rs (foliage_sways_in_the_global_wind_on_the_frame_clock); plugins/vendor/foliage/tests/scene_rows.rs (foliage_sways_in_the_global_wind_unless_it_opts_out)"
status = "verified"

[[buffer]]
key = "foliage_sources"
producers = ["FoliageSourceRow"]
consumers = []
owner = "helio_component::components::environment_rows"
disposition = "keep: FoliageComponent's type, layer and wind, derived on every write; the environment join packs them into foliage_types, foliage_layers and foliage_wind"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/foliage/tests/scene_rows.rs"
status = "verified"

# ── Render pass crates ──────────────────────────────────────────

[[pass]]
crate = "helio-pass-foliage-gbuffer"
in_default_graph = false
reads = ["foliage_layers", "foliage_types", "foliage_wind"]
owner = "helio-presets (mapping); helio-pass-foliage-gbuffer (algorithm)"
disposition = "keep: reads the environment join's foliage outputs, derived from FoliageComponent and the level's WindComponent (Phase 4); the wind's clock is the renderer's frame clock (#1109, #1123); limitations #1063, #1064 and one wind for all foliage (#1123)"
target_contract = "Phase 6; 03-gpu-reflection-and-rendering.md"
test = "plugins/installed/tests/render_acceptance.rs (foliage_reaches_the_frame, foliage_sways_in_the_global_wind_on_the_frame_clock); plugins/installed/tests/render_acceptance.rs (every_pass_of_the_editor_graph_runs)"
status = "verified"

[[pass]]
crate = "helio-pass-foliage-place"
in_default_graph = false
reads = ["foliage_interactors", "foliage_layers", "foliage_types", "foliage_wind"]
owner = "helio-presets (mapping); helio-pass-foliage-place (algorithm)"
disposition = "keep: reads the environment join's foliage outputs, derived from FoliageComponent (Phase 4); limitations #1061-#1064"
target_contract = "Phase 6; 03-gpu-reflection-and-rendering.md"
test = "plugins/installed/tests/render_acceptance.rs (foliage_reaches_the_frame); plugins/installed/tests/render_acceptance.rs (every_pass_of_the_editor_graph_runs)"
status = "verified"

# ── Lifecycle call sites ────────────────────────────────────────

[[site]]
pattern = "change-cursor"
file = "plugins/vendor/foliage/src/runtime.rs"
count = 2
owner = "plugins/vendor/foliage/src/runtime.rs (the plugin root's AnimatedContent watches)"
disposition = "keep: the kind's own, moved with it into its plugin (plugin-migration.md Phases B and C); registered from its root crate since p19"
target_contract = "Phase C; plugin-migration.md"
test = "none: no test names this row; the owning plugin's suites cover its behaviour"
status = "unverified"

[[buffer]]
key = "foliage_interactors"
producers = ["FoliageInteractorComponent"]
consumers = ["helio-pass-foliage-place"]
owner = "no writer: the engine derives no interactor rows (Phase 4)"
disposition = "unfinished (Phase 4; tracked in #1063): no foliage shader reads interactor rows and nothing produces the foliage_interaction texture"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "tracked in #1063"
status = "unfinished"

[[buffer]]
key = "foliage_layers"
producers = ["FoliageLayerComponent"]
consumers = ["helio-pass-foliage-gbuffer", "helio-pass-foliage-place"]
owner = "helio-scene-derivations environment join (execution output, placed foliage packed into the leading rows in instance order)"
disposition = "keep: a world-aligned square centred on the owner, spanning the authored altitudes; tiles re-place when the layers change, with the type table's seed; types are not yet bound to their own layers (#1062)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/foliage/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (foliage_reaches_the_frame)"
status = "verified"

[[buffer]]
key = "foliage_types"
producers = ["FoliageTypeComponent"]
consumers = ["helio-pass-foliage-gbuffer", "helio-pass-foliage-place"]
owner = "helio-scene-derivations environment join (execution output, placed foliage packed into the leading rows in instance order)"
disposition = "keep: placement draws types from the live leading rows; both foliage passes run only while a row has a density (async liveness)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/foliage/tests/scene_rows.rs; plugins/installed/tests/render_acceptance.rs (foliage_reaches_the_frame)"
status = "verified"

[[buffer]]
key = "foliage_wind"
producers = ["FoliageWindComponent"]
consumers = ["helio-pass-foliage-gbuffer", "helio-pass-foliage-place"]
owner = "helio-scene-derivations environment join (execution output, placed foliage packed into the leading rows in instance order)"
disposition = "keep: one wind row for all foliage: the first placed foliage component that opts out of the global wind, else the level's global wind (WindComponent), else the first placed component's own wind (#1123). Its clock words are unused: the foliage passes read the renderer's frame clock (#1109)"
target_contract = "Phase 4; 09-component-structure-and-graph-boundary.md"
test = "plugins/vendor/foliage/tests/scene_rows.rs (foliage_types_layers_and_wind_are_packed, foliage_sways_in_the_global_wind_unless_it_opts_out); plugins/installed/tests/render_acceptance.rs (foliage_sways_in_the_global_wind_on_the_frame_clock)"
status = "verified"
