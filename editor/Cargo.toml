[package]
name = "foliage_editor"
version = "0.1.0"
edition = "2024"
description = "Foliage (pulsar.foliage): the editor crate -- the Foliage tool mode and its palette, the level's wind entry and World Settings section, over the plugin's component crate; the plugin's root crate registers them"

[lib]
name = "foliage_editor"

[dependencies]
foliage_component = { workspace = true }
# The level editor UI the root registers through its extension points
# (`ui_level_editor::extend`).
ui_level_editor = { workspace = true }
rust-i18n = { workspace = true }
gpui-ce = { workspace = true }
ui = { workspace = true }
ui_common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
engine_state = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true
